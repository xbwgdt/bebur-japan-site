name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run sanity:typecheck
      - run: npm run sanity:build
        env:
          SANITY_STUDIO_PROJECT_ID: gbzt89e5
          SANITY_STUDIO_DATASET: production
          SANITY_STUDIO_API_VERSION: "2025-02-19"
      - run: npm run test:run
      - run: npm run audit:content
      - run: npm run build
      - run: npm run audit:static
