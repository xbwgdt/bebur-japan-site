<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1400" role="img" aria-labelledby="title desc"><title id="title">BT-9000C 塩素消毒薬注制御の構成例</title><desc id="desc">流量測定、薬注制御への流量入力。入口で消毒剤を注入、消毒池への流入水。消毒池、消毒処理。消毒池の出口で採水、出口側の残留塩素を確認。残留塩素を測定、測定値をフィードバック。塩素消毒の薬注制御、流量と残留塩素で注入量調整。実線は工程・採水、破線は計測信号・制御の関係を示す構成例。</desc><defs><marker id="water" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#086d87"/></marker><marker id="signal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2458a0"/></marker></defs><rect width="720" height="1400" rx="24" fill="#f1f7fc"/><g font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif"><text x="360" y="65" text-anchor="middle" font-size="32" font-weight="700" fill="#123b63"><tspan x="360" dy="0">BT-9000C 塩素消毒薬注制御</tspan></text><text x="360" y="116" text-anchor="middle" font-size="28" font-weight="500" fill="#086d87"><tspan x="360" dy="0">構成例｜実線：工程・採水</tspan><tspan x="360" dy="37.800000000000004">破線：計測信号・制御</tspan></text><path data-from="flow" data-to="inlet" data-relation="process" d="M360 320V365" fill="none" stroke="#086d87" stroke-width="5" marker-end="url(#water)"><title>流量測定・薬注制御への流量入力 → 入口で消毒剤を注入・消毒池への流入水（process）</title></path><path data-from="inlet" data-to="pool" data-relation="process" d="M360 510V555" fill="none" stroke="#086d87" stroke-width="5" marker-end="url(#water)"><title>入口で消毒剤を注入・消毒池への流入水 → 消毒池・消毒処理（process）</title></path><path data-from="pool" data-to="outlet" data-relation="process" d="M360 700V745" fill="none" stroke="#086d87" stroke-width="5" marker-end="url(#water)"><title>消毒池・消毒処理 → 消毒池の出口で採水・出口側の残留塩素を確認（process）</title></path><path data-from="outlet" data-to="residual" data-relation="sample" d="M360 890V935" fill="none" stroke="#086d87" stroke-width="5" marker-end="url(#water)"><title>消毒池の出口で採水・出口側の残留塩素を確認 → 残留塩素を測定・測定値をフィードバック（sample）</title></path><path data-from="residual" data-to="control" data-relation="feedback" d="M360 1080V1125" fill="none" stroke="#2458a0" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#signal)"><title>残留塩素を測定・測定値をフィードバック → 塩素消毒の薬注制御・流量と残留塩素で注入量調整（feedback）</title></path><path data-from="flow" data-to="control" data-relation="flow-input" d="M110 255H45V1205H100" fill="none" stroke="#2458a0" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#signal)"><title>流量測定・薬注制御への流量入力 → 塩素消毒の薬注制御・流量と残留塩素で注入量調整（flow-input）</title></path><path data-from="control" data-to="inlet" data-relation="dosing-control" d="M610 1240H675V480H620" fill="none" stroke="#2458a0" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#signal)"><title>塩素消毒の薬注制御・流量と残留塩素で注入量調整 → 入口で消毒剤を注入・消毒池への流入水（dosing-control）</title></path><g data-node="flow"><rect x="110" y="190" width="500" height="130" rx="16" fill="#fff" stroke="#b8d1e8" stroke-width="2"/><text x="360" y="239" text-anchor="middle" font-size="32" font-weight="600" fill="#123b63"><tspan x="360" dy="0">流量測定</tspan><tspan x="360" dy="43.2">薬注制御への流量入力</tspan></text></g><g data-node="inlet"><rect x="110" y="380" width="500" height="130" rx="16" fill="#e7f2fb" stroke="#b8d1e8" stroke-width="2"/><text x="360" y="429" text-anchor="middle" font-size="32" font-weight="600" fill="#123b63"><tspan x="360" dy="0">入口で消毒剤を注入</tspan><tspan x="360" dy="43.2">消毒池への流入水</tspan></text></g><g data-node="pool"><rect x="110" y="570" width="500" height="130" rx="16" fill="#fff" stroke="#b8d1e8" stroke-width="2"/><text x="360" y="619" text-anchor="middle" font-size="32" font-weight="600" fill="#123b63"><tspan x="360" dy="0">消毒池</tspan><tspan x="360" dy="43.2">消毒処理</tspan></text></g><g data-node="outlet"><rect x="110" y="760" width="500" height="130" rx="16" fill="#e7f2fb" stroke="#b8d1e8" stroke-width="2"/><text x="360" y="809" text-anchor="middle" font-size="32" font-weight="600" fill="#123b63"><tspan x="360" dy="0">消毒池の出口で採水</tspan><tspan x="360" dy="43.2">出口側の残留塩素を確認</tspan></text></g><g data-node="residual"><rect x="110" y="950" width="500" height="130" rx="16" fill="#fff" stroke="#b8d1e8" stroke-width="2"/><text x="360" y="999" text-anchor="middle" font-size="32" font-weight="600" fill="#123b63"><tspan x="360" dy="0">残留塩素を測定</tspan><tspan x="360" dy="43.2">測定値をフィードバック</tspan></text></g><g data-node="control"><rect x="110" y="1140" width="500" height="130" rx="16" fill="#e7f2fb" stroke="#b8d1e8" stroke-width="2"/><text x="360" y="1189" text-anchor="middle" font-size="32" font-weight="600" fill="#123b63"><tspan x="360" dy="0">塩素消毒の薬注制御</tspan><tspan x="360" dy="43.2">流量と残留塩素で注入量調整</tspan></text></g><text x="360" y="1370" text-anchor="middle" font-size="28" font-weight="400" fill="#123b63"><tspan x="360" dy="0">対象工程・仕様に応じて設置を選定</tspan></text></g></svg>