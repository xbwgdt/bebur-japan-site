<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1210" role="img" aria-labelledby="title desc"><title id="title">BT-9000L 凝集薬注制御の構成例</title><desc id="desc">原水の濁度・有機物、前段のフィードフォワード。凝集剤注入・混合、原水のpHを調整。沈殿後の濁度、凝集・沈殿後、ろ過前の参考値。凝集後の流動電流、測定値をフィードバック。凝集薬注制御、前段・後段の情報で注入量調整。実線は工程・採水、破線は計測信号・制御の関係を示す構成例。</desc><defs><marker id="water" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#086d87"/></marker><marker id="signal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2458a0"/></marker></defs><rect width="720" height="1210" rx="24" fill="#f1f7fc"/><g font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif"><text x="360" y="65" text-anchor="middle" font-size="32" font-weight="700" fill="#123b63"><tspan x="360" dy="0">BT-9000L 凝集薬注制御</tspan></text><text x="360" y="116" text-anchor="middle" font-size="28" font-weight="500" fill="#086d87"><tspan x="360" dy="0">構成例｜実線：工程・採水</tspan><tspan x="360" dy="37.800000000000004">破線：計測信号・制御</tspan></text><path data-from="raw" data-to="mix" data-relation="process" d="M360 320V365" fill="none" stroke="#086d87" stroke-width="5" marker-end="url(#water)"><title>原水の濁度・有機物・前段のフィードフォワード → 凝集剤注入・混合・原水のpHを調整（process）</title></path><path data-from="mix" data-to="settled" data-relation="coagulation-sedimentation" d="M360 510V555" fill="none" stroke="#086d87" stroke-width="5" marker-end="url(#water)"><title>凝集剤注入・混合・原水のpHを調整 → 沈殿後の濁度・凝集・沈殿後、ろ過前の参考値（coagulation-sedimentation）</title></path><path data-from="mix" data-to="streaming" data-relation="sample" d="M610 445H645V825H620" fill="none" stroke="#086d87" stroke-width="5" marker-end="url(#water)"><title>凝集剤注入・混合・原水のpHを調整 → 凝集後の流動電流・測定値をフィードバック（sample）</title></path><path data-from="raw" data-to="control" data-relation="feedforward" d="M110 255H25V1015H100" fill="none" stroke="#2458a0" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#signal)"><title>原水の濁度・有機物・前段のフィードフォワード → 凝集薬注制御・前段・後段の情報で注入量調整（feedforward）</title></path><path data-from="streaming" data-to="control" data-relation="feedback" d="M360 890V935" fill="none" stroke="#2458a0" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#signal)"><title>凝集後の流動電流・測定値をフィードバック → 凝集薬注制御・前段・後段の情報で注入量調整（feedback）</title></path><path data-from="settled" data-to="control" data-relation="reference" d="M610 635H690V1015H620" fill="none" stroke="#2458a0" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#signal)"><title>沈殿後の濁度・凝集・沈殿後、ろ過前の参考値 → 凝集薬注制御・前段・後段の情報で注入量調整（reference）</title></path><path data-from="control" data-to="mix" data-relation="dosing-control" d="M110 1050H65V480H100" fill="none" stroke="#2458a0" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#signal)"><title>凝集薬注制御・前段・後段の情報で注入量調整 → 凝集剤注入・混合・原水のpHを調整（dosing-control）</title></path><g data-node="raw"><rect x="110" y="190" width="500" height="130" rx="16" fill="#fff" stroke="#b8d1e8" stroke-width="2"/><text x="360" y="239" text-anchor="middle" font-size="32" font-weight="600" fill="#123b63"><tspan x="360" dy="0">原水の濁度・有機物</tspan><tspan x="360" dy="43.2">前段のフィードフォワード</tspan></text></g><g data-node="mix"><rect x="110" y="380" width="500" height="130" rx="16" fill="#e7f2fb" stroke="#b8d1e8" stroke-width="2"/><text x="360" y="429" text-anchor="middle" font-size="32" font-weight="600" fill="#123b63"><tspan x="360" dy="0">凝集剤注入・混合</tspan><tspan x="360" dy="43.2">原水のpHを調整</tspan></text></g><g data-node="settled"><rect x="110" y="570" width="500" height="130" rx="16" fill="#fff" stroke="#b8d1e8" stroke-width="2"/><text x="360" y="619" text-anchor="middle" font-size="32" font-weight="600" fill="#123b63"><tspan x="360" dy="0">沈殿後の濁度</tspan><tspan x="360" dy="43.2">凝集・沈殿後、ろ過前の参考値</tspan></text></g><g data-node="streaming"><rect x="110" y="760" width="500" height="130" rx="16" fill="#e7f2fb" stroke="#b8d1e8" stroke-width="2"/><text x="360" y="809" text-anchor="middle" font-size="32" font-weight="600" fill="#123b63"><tspan x="360" dy="0">凝集後の流動電流</tspan><tspan x="360" dy="43.2">測定値をフィードバック</tspan></text></g><g data-node="control"><rect x="110" y="950" width="500" height="130" rx="16" fill="#fff" stroke="#b8d1e8" stroke-width="2"/><text x="360" y="999" text-anchor="middle" font-size="32" font-weight="600" fill="#123b63"><tspan x="360" dy="0">凝集薬注制御</tspan><tspan x="360" dy="43.2">前段・後段の情報で注入量調整</tspan></text></g><text x="360" y="1180" text-anchor="middle" font-size="28" font-weight="400" fill="#123b63"><tspan x="360" dy="0">対象工程・仕様に応じて設置を選定</tspan></text></g></svg>