<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1020" role="img" aria-labelledby="title desc"><title id="title">BT-9000S 薬注制御の構成例</title><desc id="desc">凝集剤注入・管内ミキサー、原水と凝集剤を混合。混合後に採水、ミキサーより下流の取水口。ストリーミング電流、混合後の試料水を測定。凝集剤の薬注制御、測定値をフィードバック。実線は工程・採水、破線は計測信号・制御の関係を示す構成例。</desc><defs><marker id="water" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#086d87"/></marker><marker id="signal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2458a0"/></marker></defs><rect width="720" height="1020" rx="24" fill="#f1f7fc"/><g font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif"><text x="360" y="65" text-anchor="middle" font-size="32" font-weight="700" fill="#123b63"><tspan x="360" dy="0">BT-9000S 薬注制御</tspan></text><text x="360" y="116" text-anchor="middle" font-size="28" font-weight="500" fill="#086d87"><tspan x="360" dy="0">構成例｜実線：工程・採水</tspan><tspan x="360" dy="37.800000000000004">破線：計測信号・制御</tspan></text><path data-from="mix" data-to="sample" data-relation="post-mixer-sample" d="M360 320V365" fill="none" stroke="#086d87" stroke-width="5" marker-end="url(#water)"><title>凝集剤注入・管内ミキサー・原水と凝集剤を混合 → 混合後に採水・ミキサーより下流の取水口（post-mixer-sample）</title></path><path data-from="sample" data-to="streaming" data-relation="sample" d="M360 510V555" fill="none" stroke="#086d87" stroke-width="5" marker-end="url(#water)"><title>混合後に採水・ミキサーより下流の取水口 → ストリーミング電流・混合後の試料水を測定（sample）</title></path><path data-from="streaming" data-to="control" data-relation="feedback" d="M360 700V745" fill="none" stroke="#2458a0" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#signal)"><title>ストリーミング電流・混合後の試料水を測定 → 凝集剤の薬注制御・測定値をフィードバック（feedback）</title></path><path data-from="control" data-to="mix" data-relation="dosing-control" d="M610 860H665V290H620" fill="none" stroke="#2458a0" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#signal)"><title>凝集剤の薬注制御・測定値をフィードバック → 凝集剤注入・管内ミキサー・原水と凝集剤を混合（dosing-control）</title></path><g data-node="mix"><rect x="110" y="190" width="500" height="130" rx="16" fill="#fff" stroke="#b8d1e8" stroke-width="2"/><text x="360" y="239" text-anchor="middle" font-size="32" font-weight="600" fill="#123b63"><tspan x="360" dy="0">凝集剤注入・管内ミキサー</tspan><tspan x="360" dy="43.2">原水と凝集剤を混合</tspan></text></g><g data-node="sample"><rect x="110" y="380" width="500" height="130" rx="16" fill="#e7f2fb" stroke="#b8d1e8" stroke-width="2"/><text x="360" y="429" text-anchor="middle" font-size="32" font-weight="600" fill="#123b63"><tspan x="360" dy="0">混合後に採水</tspan><tspan x="360" dy="43.2">ミキサーより下流の取水口</tspan></text></g><g data-node="streaming"><rect x="110" y="570" width="500" height="130" rx="16" fill="#fff" stroke="#b8d1e8" stroke-width="2"/><text x="360" y="619" text-anchor="middle" font-size="32" font-weight="600" fill="#123b63"><tspan x="360" dy="0">ストリーミング電流</tspan><tspan x="360" dy="43.2">混合後の試料水を測定</tspan></text></g><g data-node="control"><rect x="110" y="760" width="500" height="130" rx="16" fill="#e7f2fb" stroke="#b8d1e8" stroke-width="2"/><text x="360" y="809" text-anchor="middle" font-size="32" font-weight="600" fill="#123b63"><tspan x="360" dy="0">凝集剤の薬注制御</tspan><tspan x="360" dy="43.2">測定値をフィードバック</tspan></text></g><text x="360" y="990" text-anchor="middle" font-size="28" font-weight="400" fill="#123b63"><tspan x="360" dy="0">対象工程・仕様に応じて設置を選定</tspan></text></g></svg>