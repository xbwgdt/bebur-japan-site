<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 860" role="img" aria-labelledby="title desc"><title id="title">医療・製薬の水質管理の構成例</title><desc id="desc">用途に応じた計測・取水の構成例。製薬用水・洗浄工程、用途と試料を確認、水質・不溶性微粒子、測定方法に適した計器を選定、工程に応じた品質管理、適用条件に基づいて評価</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#086d87"/></marker></defs><rect width="900" height="860" rx="24" fill="#f1f7fc"/><path d="M0 0h900v14H0" fill="#2458a0"/><g font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif"><text x="450" y="80" text-anchor="middle" font-size="36" font-weight="700" fill="#123b63"><tspan x="450" dy="0">医療・製薬の水質管理</tspan></text><text x="450" y="133" text-anchor="middle" font-size="30" font-weight="500" fill="#086d87"><tspan x="450" dy="0">計測・監視の構成例</tspan></text><rect x="65" y="190" width="770" height="130" rx="18" fill="#fff" stroke="#b8d1e8" stroke-width="2"/><circle cx="110" cy="255" r="24" fill="#2458a0"/><text x="110" y="267" text-anchor="middle" font-size="30" font-weight="700" fill="#fff"><tspan x="110" dy="0">1</tspan></text><text x="470" y="238" text-anchor="middle" font-size="34" font-weight="600" fill="#123b63"><tspan x="470" dy="0">製薬用水・洗浄工程</tspan><tspan x="470" dy="45.900000000000006">用途と試料を確認</tspan></text><path d="M450 320v36" stroke="#086d87" stroke-width="7" marker-end="url(#arrow)"/><rect x="65" y="370" width="770" height="130" rx="18" fill="#e7f2fb" stroke="#b8d1e8" stroke-width="2"/><circle cx="110" cy="435" r="24" fill="#2458a0"/><text x="110" y="447" text-anchor="middle" font-size="30" font-weight="700" fill="#fff"><tspan x="110" dy="0">2</tspan></text><text x="470" y="418" text-anchor="middle" font-size="34" font-weight="600" fill="#123b63"><tspan x="470" dy="0">水質・不溶性微粒子</tspan><tspan x="470" dy="45.900000000000006">測定方法に適した計器を選定</tspan></text><path d="M450 500v36" stroke="#086d87" stroke-width="7" marker-end="url(#arrow)"/><rect x="65" y="550" width="770" height="130" rx="18" fill="#fff" stroke="#b8d1e8" stroke-width="2"/><circle cx="110" cy="615" r="24" fill="#2458a0"/><text x="110" y="627" text-anchor="middle" font-size="30" font-weight="700" fill="#fff"><tspan x="110" dy="0">3</tspan></text><text x="470" y="598" text-anchor="middle" font-size="34" font-weight="600" fill="#123b63"><tspan x="470" dy="0">工程に応じた品質管理</tspan><tspan x="470" dy="45.900000000000006">適用条件に基づいて評価</tspan></text><text x="450" y="825" text-anchor="middle" font-size="25" font-weight="400" fill="#123b63"><tspan x="450" dy="0">構成例｜実際の設置は対象工程・仕様に応じて選定</tspan></text></g></svg>